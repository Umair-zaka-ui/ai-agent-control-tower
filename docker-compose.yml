# ---------------------------------------------------------------------------
# AI Agent Control Tower - full local stack (SPA + API + PostgreSQL).
#
#   docker compose up -d --build          # build & run web + api + db
#   docker compose up -d db               # just the database (for local dev)
#
# Open the app at http://localhost:8080 (the web container serves the SPA and
# reverse-proxies /api to the api service — same origin, no CORS).
#
# The api service runs migrations on start; set SEED_ON_START=true to also load
# demo data on first boot. See docs/deployment.md for the production checklist.
# ---------------------------------------------------------------------------
services:
  db:
    # PostgreSQL 17, matching the version this project is actually developed,
    # backed up and restored against (RECOVERY.md). Phase 3.9 aligned this:
    # it previously declared 16 with a different database name, which made
    # this service unusable as a restore target for any real backup and made
    # the recovery drill unverifiable. A logical dump from 17 cannot be
    # restored into 16, and a 16 data directory cannot be read by 17 -- so
    # the mismatch was not cosmetic.
    #
    # UPGRADING AN EXISTING CHECKOUT: the act_pgdata volume is a PostgreSQL
    # major-version-specific data directory. If you ever started this stack
    # on 16, PostgreSQL 17 will refuse to start against that volume. Dump
    # anything you need first, then remove the volume
    # (docker compose down && docker volume rm <project>_act_pgdata).
    # Deliberately not automated -- it destroys data.
    image: postgres:17-alpine
    container_name: act_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_agent_control_tower
    ports:
      - "5432:5432"
    volumes:
      - act_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agent_control_tower"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: act_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the DB host is the service name "db".
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_agent_control_tower
      JWT_SECRET_KEY: change-me-in-docker-compose
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      SEED_ON_START: "true"
      NOTIFICATIONS_ENABLED: "false"
      # Behind the web reverse-proxy: trust X-Forwarded-For so rate limiting and
      # risk scoring see the real client IP, not the proxy's (SRS 4.2.2.3.1 §19).
      TRUST_PROXY_HEADERS: "true"
      # Standard §5 envelope + security headers stay on (defaults; explicit here).
      RESPONSE_ENVELOPE_ENABLED: "true"
      SECURITY_HEADERS_ENABLED: "true"
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # Empty = same-origin; the SPA calls /api/... and nginx proxies to api.
        VITE_API_BASE_URL: ""
    container_name: act_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  act_pgdata:
